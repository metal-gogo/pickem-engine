pre-commit:
  parallel: true
  commands:
    format:
      run: pnpm run fmt:check
    lint:
      run: pnpm run lint
    secrets:
      run: pnpm run security:secrets:staged

pre-push:
  parallel: true
  commands:
    types:
      run: pnpm run verify:types
    db:
      run: pnpm run verify:db
    security:
      run: pnpm run verify:security
    tests:
      run: pnpm run verify:tests
