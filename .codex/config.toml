[mcp_servers.pickem-engine-storybook]
url = "http://localhost:6100/mcp"

[mcp_servers.stitch]
url = "https://stitch.googleapis.com/mcp"

  [mcp_servers.stitch.env_http_headers]
  X-Goog-Api-Key = "STITCH_GOOGLE_API_KEY"

[mcp_servers.neon]
type = "http"
url = "https://mcp.neon.tech/mcp"

  [mcp_servers.neon.env_http_headers]
  Authorization = "NEON_MCP_AUTHORIZATION"
