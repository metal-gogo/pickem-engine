name: Deploy Preview

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
  workflow_dispatch:
    inputs:
      preview_alias:
        description: Preview alias for manual preview deploys
        required: false
        default: manual

concurrency:
  group: deploy-preview-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.pull_requests[0].number
      )
    environment:
      name: preview
      url: ${{ steps.preview-url.outputs.url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production dependency audit
        run: pnpm run security:audit:ci:prod

      - name: Build app
        run: pnpm run build

      - name: Set preview URL
        id: preview-url
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            preview_alias="${{ inputs.preview_alias }}"
            preview_label="manual"
          else
            preview_alias="pr-${{ github.event.workflow_run.pull_requests[0].number }}"
            preview_label="PR #${{ github.event.workflow_run.pull_requests[0].number }}"
          fi

          echo "alias=${preview_alias}" >> "$GITHUB_OUTPUT"
          echo "label=${preview_label}" >> "$GITHUB_OUTPUT"
          echo "url=https://${preview_alias}-pickem-engine-preview.mgogo.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Upload Cloudflare preview version
        run: |
          pnpm exec wrangler versions upload --config wrangler.preview.jsonc \
            --preview-alias "${{ steps.preview-url.outputs.alias }}" \
            --tag "${{ steps.preview-url.outputs.alias }}-${GITHUB_SHA::7}" \
            --message "Preview for ${{ steps.preview-url.outputs.label }} at ${GITHUB_SHA}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Write deployment summary
        run: |
          echo "### Cloudflare preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview URL: ${{ steps.preview-url.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
