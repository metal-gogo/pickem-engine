name: Deploy Production

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )
    environment:
      name: production
      url: https://futbol.quest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production dependency audit
        run: pnpm run security:audit:ci:prod

      - name: Build app
        run: pnpm run build

      - name: Run production migrations
        run: pnpm run db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.NEON_PROD_DIRECT_URL }}

      - name: Deploy Cloudflare production Worker
        run: |
          pnpm exec wrangler deploy \
            --tag "main-${GITHUB_SHA::7}" \
            --message "Production deploy for ${GITHUB_SHA}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
